name: Плейлист из папки с музыкой
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Обновить audio/playlist.json
        run: |
          curl -fsS 'https://files.adminpro.win/public/api/resources?path=%2F&hash=1Wv0m2WGGZRyidB_K2fIUw' \
            | jq -c '[.files[]? | select((.type // "" | startswith("audio/")) or (.name | test("\\.(mp3|m4a|ogg|wav|aac|flac)$"; "i"))) | .name] | sort' > audio/playlist.json.new
          if ! cmp -s audio/playlist.json.new audio/playlist.json; then
            mv audio/playlist.json.new audio/playlist.json
            git config user.name 'playlist-bot'
            git config user.email 'playlist-bot@users.noreply.github.com'
            git add audio/playlist.json
            git commit -m 'Плейлист обновлён из папки с музыкой'
            git push
          fi
